<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MedHub — Native PDF Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fa;color:#17243a}body{display:flex;flex-direction:column}.top{height:68px;flex:none;background:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid #e9edf2}.brand{font-weight:750;white-space:nowrap}.title{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.btn{background:#1677ff;color:#fff;text-decoration:none;border-radius:24px;padding:11px 17px;font-size:13px;font-weight:650;white-space:nowrap}.btn.secondary{background:#eef4ff;color:#1677ff}.view{flex:1;min-height:0;padding:14px;display:flex;flex-direction:column;gap:10px}.note{font-size:12px;color:#66758b;text-align:center}iframe{width:100%;flex:1;min-height:0;border:0;background:#fff;border-radius:10px;box-shadow:0 2px 18px #17243a10}@media(max-width:600px){.top{padding:8px;gap:7px;height:60px}.title{font-size:12px}.brand{font-size:12px}.btn{padding:9px 10px;font-size:12px}.view{padding:6px}.note{font-size:11px}}
</style>
</head>
<body>
<header class="top"><span class="brand">📄 MedHub Reader</span><span class="title">Native Browser PDF Test</span><a id="download" class="btn" download="test.pdf">Download</a><a id="open" class="btn secondary" target="_blank" rel="noopener">Open PDF</a></header>
<main class="view"><div class="note">Native browser PDF preview · No PDF.js · No changes to your existing reader</div><iframe id="pdf" title="Native PDF preview"></iframe></main>
<script>
const params=new URLSearchParams(location.search);
// ?file= accepts a same-origin path or a direct HTTPS PDF URL. Default is a public test PDF.
const candidate=params.get('file') || 'https://mozilla.github.io/pdf.js/web/compressed.tracemonkey-pldi-09.pdf';
let url;
try {const parsed=new URL(candidate,location.href);if(!['https:','http:'].includes(parsed.protocol))throw Error('Unsupported URL');url=parsed.href;}catch{url='https://mozilla.github.io/pdf.js/web/compressed.tracemonkey-pldi-09.pdf';}
document.getElementById('pdf').src=url;
document.getElementById('download').href=url;
document.getElementById('open').href=url;
</script>
</body></html>

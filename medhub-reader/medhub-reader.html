<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F9FC">
<title>MedHub Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="medhub-reader/reader.css">
</head>
<body>
<div id="window" class="window">
  <header class="topbar">
    <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></span><span class="brand-name">MedHub</span></div>
    <h1 id="title" class="title">Lecture</h1>
    <div class="actions">
      <div class="menu-wrap">
        <button id="menubtn" class="icon-btn" aria-label="More options" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg></button>
        <div id="menu" class="menu" role="menu" hidden>
          <button id="m-open" role="menuitem"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5H5V6h5"/></svg>Open PDF in browser</button>
          <button id="m-outline" role="menuitem"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/></svg><span id="m-outline-label">Show outline</span></button>
          <button id="m-full" role="menuitem"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Fullscreen reading</button>
        </div>
      </div>
      <button id="download" class="pill" disabled><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14"/></svg><span>Download</span></button>
    </div>
    <div id="progress" class="progress" hidden><i></i></div>
  </header>

  <div class="body">
    <div id="scrim" class="scrim"></div>
    <aside id="sidebar" class="sidebar" aria-label="Document outline">
      <div class="side-inner"><h2 id="side-title">Pages</h2><nav id="side-list" class="side-list"></nav></div>
    </aside>

    <div class="main">
      <main id="viewer" class="viewer" tabindex="0"><div id="pages" class="pages"></div></main>

      <section id="state" class="state" hidden>
        <div class="state-card">
          <div id="spinner" class="spinner" hidden></div>
          <h2 id="state-title"></h2>
          <p id="state-text"></p>
          <div class="state-actions">
            <button id="open" class="btn">Open a PDF</button>
            <button id="retry" class="btn ghost" hidden>Try again</button>
          </div>
        </div>
      </section>

      <nav id="toolbar" class="toolbar" aria-label="Reading controls" hidden>
        <button id="prev" class="icon-btn" aria-label="Previous page"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
        <div class="pager"><input id="page" inputmode="numeric" pattern="[0-9]*" aria-label="Page number" value="1"><span>/</span><span id="count">–</span></div>
        <button id="next" class="icon-btn" aria-label="Next page"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        <span class="sep"></span>
        <button id="zout" class="icon-btn" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
        <button id="zin" class="icon-btn" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
        <button id="fit" class="icon-btn" aria-label="Fit to width" title="Fit to width"><svg viewBox="0 0 24 24"><path d="M4 12h16M4 12l3-3M4 12l3 3M20 12l-3-3M20 12l-3 3M4 5v14M20 5v14"/></svg></button>
      </nav>
    </div>
  </div>
</div>

<input id="file" type="file" accept="application/pdf,.pdf" hidden>
<script>
  // Optional MedHub integration hooks (see README):
  // window.MEDHUB_READER_CONFIG = {
  //   allowedOrigins: ['https://files.medhub.example'],
  //   getHeaders: async () => ({ Authorization: 'Bearer ' + await getToken() }),
  //   withCredentials: false
  // };
</script>
<script type="module" src="medhub-reader/reader.js"></script>
</body>
</html>

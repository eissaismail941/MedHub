<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MedHub — Native PDF Test V2</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#17243a;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{height:66px;background:white;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;gap:12px;border-bottom:1px solid #e8ecf2}header strong{white-space:nowrap}header span{font-size:14px;text-align:center}button,a.btn{border:0;border-radius:20px;background:#1677ff;color:white;padding:10px 16px;font:inherit;text-decoration:none;cursor:pointer}.muted{background:#eaf2ff!important;color:#1266d8!important}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px}.controls label{font-size:13px}.controls input{flex:1;min-width:160px;padding:9px;border:1px solid #d7deea;border-radius:10px}.status{padding:0 16px 10px;color:#64748b;font-size:12px}main{margin:0 12px 12px;background:white;border-radius:14px;overflow:hidden;height:calc(100dvh - 165px);min-height:300px}iframe,embed,object{display:block;width:100%;height:100%;border:0}.hint{padding:20px} @media(max-width:600px){header span{display:none}main{height:calc(100dvh - 190px)}}
</style></head><body><header><strong>📄 MedHub Reader</strong><span>Native Browser PDF Test V2</span><a class="btn muted" id="external" target="_blank" rel="noopener">Open PDF ↗</a></header><section class="controls"><button id="iframeBtn">iframe</button><button class="muted" id="embedBtn">embed</button><button class="muted" id="objectBtn">object</button><label for="url">PDF URL:</label><input id="url" aria-label="PDF URL"><button id="load">Load</button></section><div class="status" id="status">Test each method. If the browser shows Open instead of pages, it is not rendering inline.</div><main id="view"></main><script>
const fallback='https://mozilla.github.io/pdf.js/web/compressed.tracemonkey-pldi-09.pdf';const params=new URLSearchParams(location.search);const input=document.getElementById('url');input.value=params.get('file')||fallback;let mode='iframe';const view=document.getElementById('view');const status=document.getElementById('status');const buttons={iframe:document.getElementById('iframeBtn'),embed:document.getElementById('embedBtn'),object:document.getElementById('objectBtn')};function render(next){mode=next;let url;try{url=new URL(input.value,location.href);if(!['https:','http:'].includes(url.protocol))throw Error();}catch{status.textContent='Please enter a valid HTTP(S) PDF URL.';return;}document.getElementById('external').href=url.href;view.replaceChildren();const el=document.createElement(mode);if(mode==='iframe'){el.src=url.href;el.title='Native PDF iframe test';}else if(mode==='embed'){el.src=url.href;el.type='application/pdf';}else{el.data=url.href;el.type='application/pdf';const p=document.createElement('p');p.className='hint';p.textContent='This browser cannot display this PDF inline.';el.append(p);}view.append(el);Object.entries(buttons).forEach(([name,btn])=>btn.className=name===mode?'':'muted');status.textContent='Testing '+mode+' — browser support varies. An Open button means inline rendering did not work.';}Object.entries(buttons).forEach(([name,btn])=>btn.addEventListener('click',()=>render(name)));document.getElementById('load').addEventListener('click',()=>render(mode));render('iframe');
</script></body></html>
